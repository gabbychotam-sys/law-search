  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>חיפוש עבירות וחוקי עזר — נתונים מובנים</title>
  <style>
    :root { --gap: var(--gap); --radius: 14px; --shadow: 0 6px 16px rgba(0,0,0,0.08); }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Emoji', sans-serif;
           margin: 0; background: #f7f7f7; color: #111; }
    header { background: white; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 34px; margin: 0; }
    .card { background: white; border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
    .grid { display: grid; gap: var(--gap); }
    .grid-2 { grid-template-columns: 1fr; }
    @media(min-width: 800px){ .grid-2 { grid-template-columns: 1fr 2fr; } }
    label { font-size: 13px; color: #333; display: inline-block; margin-bottom: 4px; }
    select, input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; }
    .row { display: flex; gap: var(--gap); flex-wrap: wrap; align-items: center; }
    .pill { padding: 6px 10px; border-radius: 999px; background: #f0f0f0; font-size: 12px; }
    .muted { color: #666; }
    .btn { padding: 10px 14px; border-radius: 12px; border: 1px solid #ddd; background: white; cursor: pointer; }
    .results { display: grid; gap: var(--gap); margin-top: var(--gap); }
    .item { background: white; border: 1px solid #eee; border-radius: 14px; padding: 12px; }
    .item h3 { margin: 0 0 6px 0; font-size: 16px; }
    .kvs { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 14px; }
    .copy { font-size: 12px; color: #0073e6; cursor: pointer; margin-right: 8px; }
    .counter { font-size: 12px; color: #666; }
    .hr { height: 1px; background: #eee; margin: 10px 0; }
    footer { text-align: center; font-size: 12px; color: #666; padding: 24px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef6ff; color: #0b62d6; font-size: 12px; margin-inline-start: 8px; }
  
.orgbar{display:flex;align-items:center;gap:8px}.subtitle{font-size:14px;color:#333}

/* --- View Mode Toolbar --- */
.viewmode { display:flex; align-items:center; gap:8px; }
.viewmode button { padding:8px 10px; border-radius:10px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:14px; }
.viewmode button.active { border-color:#0b62d6; box-shadow:0 0 0 3px rgba(11,98,214,0.12); }
.viewmode .ico { font-size:16px; margin-inline-end:6px; }
/* Modes */
:root { --base-font: 16px; --wrap-max: 1100px; --card-radius: 14px; --gap: var(--gap); }
.mode-mobile { --base-font: 18px; --wrap-max: 560px; --card-radius: 16px; --gap: var(--gap); }
.mode-desktop { --base-font: 16px; --wrap-max: 1100px; --card-radius: 14px; --gap: var(--gap); }
body { font-size: var(--base-font); }

  const senSel = document.getElementById('sensFilter');

  lawSel.innerHTML = '<option value="">— כל החוקים —</option>' + lawSet.sort((a,b)=>a.localeCompare(b)).map(v => `<option value="${v}">${v}</option>`).join('');
  entSel.innerHTML = '<option value="">הכל</option>' + entitySet.sort((a,b)=>a.localeCompare(b)).map(v => `<option value="${v}">${v}</option>`).join('');
  senSel.innerHTML = '<option value="">הכל</option>' + sensSet.sort((a,b)=>a.localeCompare(b)).map(v => `<option value="${v}">${v}</option>`).join('');
}

function search(){
  const law = document.getElementById('lawFilter').value;      // empty means "all laws"
  const q = normalizeHebrew(document.getElementById('q').value || '');
  const ent = document.getElementById('entityFilter').value;
  const sen = document.getElementById('sensFilter').value;
  const results = document.getElementById('results');
  results.innerHTML = '';

  // New behavior:
  // - If law selected and q empty -> show ALL offenses for that law
  // - If q typed with no law -> search ACROSS all laws
  // - If both -> search within the selected law
  if (!law && q.length < 1) {
    document.getElementById('count').textContent = '';
    return;
  }

  const tokens = q.length ? q.toLowerCase().split(' ').filter(Boolean) : [];

  const out = [];
  for (let i=0;i<data.length;i++){
    const r = data[i]; const n = normalized[i];
    if (law && r[columns.law] !== law) continue;
    if (ent && r[columns.entity] !== ent) continue;
    if (sen && r[columns.sensitivity] !== sen) continue;
    if (tokens.length) {
      const hay = (n.offense + ' ' + n.essence).toLowerCase();
      const ok = tokens.every(tok => hay.includes(tok));
      if (!ok) continue;
    }
    out.push(r);
    if (out.length >= 500) break;
  }

  document.getElementById('count').textContent = `(${out.length} תוצאות)`;
  // Sort: by law, then code (numeric if possible)
  out.sort((a,b)=> {
    const la = byKey(a, columns.law).localeCompare(byKey(b, columns.law));
    if (la !== 0) return la;
    const ca = parseIntSafe(byKey(a, columns.code)) ?? 0;
    const cb = parseIntSafe(byKey(b, columns.code)) ?? 0;
    return ca - cb;
  });

  for (const r of out){
    const code = byKey(r, columns.code);
    const amount = parseIntSafe(byKey(r, columns.amount));
    const offense = byKey(r, columns.offense);
    const lawName = byKey(r, columns.law);
    const section = byKey(r, columns.section);
    const essence = byKey(r, columns.essence);
    const entity = byKey(r, columns.entity);
    const sens = byKey(r, columns.sensitivity);

    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <h3>${offense || '(ללא תיאור)'} <span class="pill">${lawName}</span></h3>
      <div class="kvs">
        <div class="muted">מס׳ בחניתא</div><div>${code || '-'}</div>
        <div class="muted">גובה הקנס</div><div>${Number.isFinite(amount) ? '₪ ' + amount.toLocaleString('he-IL') : (byKey(r, columns.amount) || '-')} </div>
        <div class="muted">סעיף חוק</div><div>${section || '-'}</div>
        <div class="muted">מהות</div><div>${essence || '-'}</div>
        <div class="muted">יחיד/תאגיד</div><div>${entity || '-'}</div>
        <div class="muted">רגישות</div><div>${sens || '-'}</div>
      </div>
      <div class="hr"></div>
      <div class="row">
        <span class="muted">קוד: ${code || '-'}</span>
        <span class="copy" title="העתקה ללוח">העתק</span>
      </div>
    `;
    el.querySelector('.copy').addEventListener('click', async () => {
      const text = `קוד: ${code}\nקנס: ₪ ${Number.isFinite(amount) ? amount.toLocaleString('he-IL') : byKey(r, columns.amount)}\nעבירה: ${offense}\nחוק: ${lawName}\nסעיף: ${section}`;
      try { await navigator.clipboard.writeText(text); alert('הועתק ללוח'); } catch (e) { alert('לא ניתן להעתיק: ' + e); }
    });
    results.appendChild(el);
  }
}

// Init
(function init(){
  // Populate filters and show everything for 'all laws' initially (empty law + empty q => no results, by design)
  const lawSel = document.getElementById('lawFilter');
  const entSel = document.getElementById('entityFilter');
  const senSel = document.getElementById('sensFilter');
  populateFilters();
  document.getElementById('meta').textContent = `שורות: ${ROW_COUNT.toLocaleString('he-IL')} • יוצר בתאריך ${GENERATED_AT} • קידוד מקור: ${SOURCE_ENCODING}`;
  lawSel.addEventListener('change', search);
  entSel.addEventListener('change', search);
  senSel.addEventListener('change', search);
  document.getElementById('q').addEventListener('input', search);
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('q').value='';
    entSel.value='';
    senSel.value='';
    search();
  });
})();

// --- View Mode Toggle (mobile/desktop) ---
(function(){
  var KEY='viewModePref_v1';
  var elMobile=document.getElementById('btnMobile');
  var elDesktop=document.getElementById('btnDesktop');
  function apply(mode){
    document.body.classList.remove('mode-mobile','mode-desktop');
    document.body.classList.add(mode==='mobile'?'mode-mobile':'mode-desktop');
    if (elMobile && elDesktop){
      elMobile.classList.toggle('active', mode==='mobile');
      elDesktop.classList.toggle('active', mode==='desktop');
    }
    try{ localStorage.setItem(KEY, mode); }catch(e){}
    // Adjust viewport meta for better layout fit
    var vp=document.querySelector('meta[name="viewport"]');
    if (!vp){
      vp=document.createElement('meta');
      vp.setAttribute('name','viewport');
      document.head.appendChild(vp);
    }
    if (mode==='mobile'){
      vp.setAttribute('content','width=device-width, initial-scale=1, maximum-scale=1');
    } else {
      // desktop: allow normal scaling, keep device-width
      vp.setAttribute('content','width=device-width, initial-scale=1');
    }
  }
  function init(){
    var pref=null;
    try{ pref=localStorage.getItem(KEY); }catch(e){}
    // Auto-detect if no pref saved
    var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    var mode = pref || (isMobile ? 'mobile' : 'desktop');
    apply(mode);
    if (elMobile) elMobile.addEventListener('click', function(){ apply('mobile'); });
    if (elDesktop) elDesktop.addEventListener('click', function(){ apply('desktop'); });
  }
  if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
